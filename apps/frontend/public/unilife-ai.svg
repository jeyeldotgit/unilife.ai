<svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>UniLife.AI app icon</title>
  <desc>Rounded square icon in #0058be with white speech bubble, lightning bolt tail, U with mortarboard</desc>

  <!-- Background rounded square -->
  <rect width="80" height="80" rx="18" fill="#0058be"/>

  <!-- Speech bubble body -->
  <rect x="10" y="10" width="60" height="44" rx="8" fill="white"/>

  <!-- Lightning bolt tail (bottom-left of bubble) -->
  <polygon points="24,54 16,68 22,68 14,80 30,64 23,64" fill="white"/>

  <!-- U letter inside bubble -->
  <text x="40" y="46" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="30" fill="#0058be" text-anchor="middle">U</text>

  <!-- Mortarboard flat board -->
  <rect x="22" y="10" width="36" height="5" rx="1.5" fill="#0058be"/>
  <!-- Cap base -->
  <rect x="30" y="15" width="20" height="6" rx="2" fill="#0058be"/>
  <!-- Tassel line -->
  <line x1="58" y1="12" x2="65" y2="22" stroke="#0058be" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Tassel dot -->
  <circle cx="65" cy="25" r="2.5" fill="#0058be"/>

  <!-- Gold accent spark dot -->
  <circle cx="68" cy="12" r="3.5" fill="#FFD23F"/>
</svg>
